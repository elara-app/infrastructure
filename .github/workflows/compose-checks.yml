name: Compose checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  render-compose:
    name: Render compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate and render compose.yml
        run: docker compose -f compose.yml config --quiet
      - name: Render published compose
        run: docker compose -f compose.published.yml config --format json > /tmp/published.json
      - name: Render published compose with host token drift
        run: VAULT_TOKEN=drifted SPRING_CLOUD_VAULT_TOKEN=drifted docker compose -f compose.published.yml config --format json > /tmp/published-drift.json
      - name: Render published compose with port overrides
        run: |
          ELARA_BIND=127.0.0.2 \
          ELARA_PORT_CONFIG=18888 \
          ELARA_PORT_DISCOVERY=18761 \
          ELARA_PORT_GATEWAY=18080 \
          ELARA_PORT_INVENTORY=18081 \
          ELARA_PORT_UOM=18082 \
          ELARA_PORT_RABBITMQ=15673 \
          ELARA_PORT_RABBITMQ_MGMT=15674 \
          ELARA_PORT_VAULT=18200 \
          docker compose -f compose.published.yml config --format json > /tmp/published-overrides.json
      - name: Render published compose with local logs overlay
        run: docker compose -f compose.published.yml -f compose.logs.yml config --format json > /tmp/published-logs.json
      - name: Assert published compose contract
        shell: bash
        run: |
          set -euo pipefail
          published=/tmp/published.json
          checked=0

          check() {
            local label="$1"
            local filter="$2"
            if ! jq -e "$filter" "$published" >/dev/null; then
              echo "::error::published compose assertion failed: $label" >&2
              exit 1
            fi
            checked=$((checked + 1))
          }

          check "exactly ten expected services" '
            (.services | keys | sort) == [
              "api-gateway",
              "config-service",
              "discovery-service",
              "inventory-service",
              "postgres-inventory",
              "postgres-uom",
              "rabbitmq",
              "unit-of-measure-service",
              "vault",
              "vault-loader"
            ]'

          check "project name and single bridge network" '
            .name == "elara-demo"
            and (.networks | keys) == ["elara-net"]
            and .networks["elara-net"].driver == "bridge"'

          check "no top-level volumes, configs, or secrets" '
            ([.volumes, .configs, .secrets] | map(. // {} | length) | add) == 0'

          check "no service builds" '
            .services | all(has("build") | not)'

          check "all mounts are tmpfs" '
            [.services[] | (.volumes // [])[] | select(.type != "tmpfs")] | length == 0'

          check "no env_file references" '
            [.services[] | select(has("env_file"))] | length == 0'

          check "no service configs or secrets" '
            [.services[] | select(has("configs") or has("secrets"))] | length == 0'

          check "both Postgres services use one database each" '
            .services["postgres-inventory"].environment.POSTGRES_DB == "inventory_db"
            and .services["postgres-uom"].environment.POSTGRES_DB == "unit_of_measure_db"
            and ([.services["postgres-inventory"], .services["postgres-uom"]]
                 | all(.environment | has("POSTGRES_MULTIPLE_DATABASES") | not))'

          # shellcheck disable=SC2016
          check "both Postgres services use a 128 MiB tmpfs PGDATA" '
            . as $root
            | ["postgres-inventory", "postgres-uom"]
            | all(. as $name
                | ($root.services[$name].volumes | length == 1)
                  and $root.services[$name].volumes[0].type == "tmpfs"
                  and $root.services[$name].volumes[0].target == "/var/lib/postgresql/data"
                  and $root.services[$name].volumes[0].tmpfs.size == "134217728")'

          # shellcheck disable=SC2016
          check "both Postgres healthchecks probe TCP with container credentials" '
            . as $root
            | ["postgres-inventory", "postgres-uom"]
            | all(. as $name
                | $root.services[$name].healthcheck.test[0] == "CMD-SHELL"
                  and ($root.services[$name].healthcheck.test[1] | contains("pg_isready -h 127.0.0.1 -p 5432"))
                  and ($root.services[$name].healthcheck.test[1] | contains("$${POSTGRES_USER}"))
                  and ($root.services[$name].healthcheck.test[1] | contains("$${POSTGRES_DB}"))
                  and $root.services[$name].healthcheck.test != ["NONE"]
                  and $root.services[$name].healthcheck.disable != true)'

          check "both Postgres services cap memory at 512 MiB" '
            [.services["postgres-inventory"].mem_limit,
             .services["postgres-uom"].mem_limit] == ["536870912", "536870912"]'

          check "vault caps memory at 512 MiB" '
            .services.vault.mem_limit == "536870912"'

          check "published ports are the eight expected loopback mappings" '
            ([.services[] | (.ports // [])[]
              | "\(.host_ip):\(.published):\(.target)"] | sort) == [
              "127.0.0.1:15672:15672",
              "127.0.0.1:5672:5672",
              "127.0.0.1:8080:8080",
              "127.0.0.1:8081:8081",
              "127.0.0.1:8082:8082",
              "127.0.0.1:8200:8200",
              "127.0.0.1:8761:8761",
              "127.0.0.1:8888:8888"
            ]'

          check "every service uses bounded json-file logging" '
            .services | to_entries | all(
              .value.logging.driver == "json-file"
              and .value.logging.options["max-size"] == "10m"
              and .value.logging.options["max-file"] == "3")'

          # shellcheck disable=SC2016
          check "all nine long-running services have healthchecks" '
            . as $root
            | ["config-service", "discovery-service", "api-gateway",
               "inventory-service", "unit-of-measure-service",
               "postgres-inventory", "postgres-uom", "rabbitmq", "vault"]
            | all(. as $name
                | ($root.services[$name].healthcheck.test | length) > 0
                  and $root.services[$name].healthcheck.test != ["NONE"]
                  and $root.services[$name].healthcheck.disable != true)'

          # shellcheck disable=SC2016
          check "vault runs a dev server with the root token default" '
            .services["vault"] as $vault
            | $vault.command == [
                "server",
                "-dev",
                "-dev-root-token-id=00000000-0000-0000-0000-000000000000"
              ]
              and $vault.healthcheck.test == ["CMD", "vault", "status"]
              and $vault.healthcheck.test != ["NONE"]
              and $vault.healthcheck.disable != true'

          # shellcheck disable=SC2016
          check "vault-loader is a one-shot shell block that waits for healthy vault" '
            .services["vault-loader"] as $loader
            | $loader.image == "hashicorp/vault:1.16.3"
              and $loader.entrypoint == ["/bin/sh", "-c"]
              and ($loader.command | length) == 1
              and $loader.restart == "no"
              and $loader.depends_on.vault.condition == "service_healthy"
              and ($loader | has("healthcheck") | not)
              and ($loader | has("profiles") | not)'

          # shellcheck disable=SC2016
          check "vault-loader and vault use the dev root token" '
            .services["vault-loader"].environment.VAULT_ADDR == "http://vault:8200"
            and .services["vault-loader"].environment.VAULT_TOKEN == "00000000-0000-0000-0000-000000000000"
            and .services.vault.environment.VAULT_DEV_ROOT_TOKEN_ID == "00000000-0000-0000-0000-000000000000"'

          # shellcheck disable=SC2016
          check "vault-loader seeds and verifies both service secret paths" '
            .services["vault-loader"].command[0] as $command
            | ($command | gsub("\\\\\\n\\s*"; " ") | gsub("\\s+"; " ")) as $flat
            | ($flat | split("vault kv ")) as $parts
            | ($parts | length) == 5
              and $parts[1] == "put secret/inventory-service/dev spring.datasource.username=postgres spring.datasource.password=postgres spring.rabbitmq.username=elara spring.rabbitmq.password=elara "
              and $parts[2] == "put secret/unit-of-measure-service/dev spring.datasource.username=postgres spring.datasource.password=postgres spring.rabbitmq.username=elara spring.rabbitmq.password=elara "
              and ($parts[3] | startswith("get secret/inventory-service/dev "))
              and ($parts[4] | startswith("get secret/unit-of-measure-service/dev "))'

          # shellcheck disable=SC2016
          check "demo credential literals match the vault-loader seed values" '
            . as $root
            | (["postgres-inventory", "postgres-uom"]
               | all(. as $name
                   | $root.services[$name].environment.POSTGRES_USER == "postgres"
                     and $root.services[$name].environment.POSTGRES_PASSWORD == "postgres"))
              and $root.services["rabbitmq"].environment.RABBITMQ_DEFAULT_USER == "elara"
              and $root.services["rabbitmq"].environment.RABBITMQ_DEFAULT_PASS == "elara"
              and (["inventory-service", "unit-of-measure-service"]
                   | all(. as $name
                       | $root.services[$name].environment
                       | .SPRING_DATASOURCE_USERNAME == "postgres"
                         and .SPRING_DATASOURCE_PASSWORD == "postgres"
                         and .SPRING_RABBITMQ_USERNAME == "elara"
                         and .SPRING_RABBITMQ_PASSWORD == "elara"))'

          # shellcheck disable=SC2016
          check "inventory-service waits for dependencies including loader completion" '
            .services["inventory-service"].depends_on as $deps
            | $deps["config-service"].condition == "service_healthy"
              and $deps["discovery-service"].condition == "service_healthy"
              and $deps["postgres-inventory"].condition == "service_healthy"
              and $deps["rabbitmq"].condition == "service_healthy"
              and $deps["vault"].condition == "service_healthy"
              and $deps["vault-loader"].condition == "service_completed_successfully"'

          # shellcheck disable=SC2016
          check "unit-of-measure-service waits for dependencies including loader completion" '
            .services["unit-of-measure-service"].depends_on as $deps
            | $deps["config-service"].condition == "service_healthy"
              and $deps["discovery-service"].condition == "service_healthy"
              and $deps["postgres-uom"].condition == "service_healthy"
              and $deps["rabbitmq"].condition == "service_healthy"
              and $deps["vault"].condition == "service_healthy"
              and $deps["vault-loader"].condition == "service_completed_successfully"'

          # shellcheck disable=SC2016
          check "service environments target compose siblings" '
            . as $root
            | ["inventory-service", "unit-of-measure-service"]
            | all(. as $name
                | $root.services[$name].environment as $env
                | (if $name == "inventory-service"
                   then $env.SPRING_DATASOURCE_URL == "jdbc:postgresql://postgres-inventory:5432/inventory_db"
                   else $env.SPRING_DATASOURCE_URL == "jdbc:postgresql://postgres-uom:5432/unit_of_measure_db"
                   end)
                  and $env.SPRING_DATASOURCE_USERNAME == "postgres"
                  and $env.SPRING_DATASOURCE_PASSWORD == "postgres"
                  and $env.SPRING_RABBITMQ_HOST == "rabbitmq"
                  and $env.SPRING_RABBITMQ_PORT == "5672"
                  and $env.SPRING_RABBITMQ_USERNAME == "elara"
                  and $env.SPRING_RABBITMQ_PASSWORD == "elara"
                  and $env.CONFIG_URI == "http://config-service:8888"
                  and $env.EUREKA_URI == "http://discovery-service:8761/eureka/"
                  and $env.VAULT_URI == "http://vault:8200"
                  and $env.VAULT_TOKEN == "00000000-0000-0000-0000-000000000000"
                  and $env.SPRING_CLOUD_VAULT_TOKEN == "00000000-0000-0000-0000-000000000000")'

          # shellcheck disable=SC2016
          check "api-gateway targets config and discovery siblings" '
            .services["api-gateway"].environment as $env
            | $env.CONFIG_URI == "http://config-service:8888"
              and $env.EUREKA_URI == "http://discovery-service:8761/eureka/"'

          # shellcheck disable=SC2016
          check "service database URLs target the exact sibling databases" '
            .services["inventory-service"].environment.SPRING_DATASOURCE_URL == "jdbc:postgresql://postgres-inventory:5432/inventory_db"
            and .services["unit-of-measure-service"].environment.SPRING_DATASOURCE_URL == "jdbc:postgresql://postgres-uom:5432/unit_of_measure_db"'

          # shellcheck disable=SC2016
          check "all five Java services set the JVM heap percentage" '
            . as $root
            | ["config-service", "discovery-service", "api-gateway",
               "inventory-service", "unit-of-measure-service"]
            | all(. as $name
                | $root.services[$name].environment.JAVA_TOOL_OPTIONS == "-XX:MaxRAMPercentage=75")'

          # shellcheck disable=SC2016
          check "config-service clones main on start without a git URI override" '
            .services["config-service"].environment as $env
            | $env.SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL == "main"
              and $env.SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START == "true"
              and ($env | has("CONFIG_GIT_URI") | not)'

          check "five Elara images are pull-only latest tags" '
            ([.services[].image | select(startswith("ghcr.io/elara-app/"))] | sort) == [
              "ghcr.io/elara-app/api-gateway:latest",
              "ghcr.io/elara-app/config-service:latest",
              "ghcr.io/elara-app/discovery-service:latest",
              "ghcr.io/elara-app/inventory-service:latest",
              "ghcr.io/elara-app/unit-of-measure-service:latest"
            ]'

          # Keep these literals in sync with the exact pins in both compose files;
          # a Dependabot compose update must update this assertion too.
          check "infrastructure images are the expected pinned tags" '
            [.services["postgres-inventory"].image,
             .services["postgres-uom"].image] == ["postgres:16.15-alpine", "postgres:16.15-alpine"]
            and .services["rabbitmq"].image == "rabbitmq:3.13.7-management-alpine"
            and .services["vault"].image == "hashicorp/vault:1.16.3"
            and .services["vault-loader"].image == "hashicorp/vault:1.16.3"'

          # A second render proves the token pins ignore host-level drift.
          published=/tmp/published-drift.json
          # shellcheck disable=SC2016
          check "host VAULT_TOKEN drift cannot reach the loader or Java services" '
            .services["vault-loader"].environment.VAULT_TOKEN == "00000000-0000-0000-0000-000000000000"
            and .services.vault.environment.VAULT_DEV_ROOT_TOKEN_ID == "00000000-0000-0000-0000-000000000000"
            and ([.services["inventory-service"], .services["unit-of-measure-service"]]
                 | all(.environment.VAULT_TOKEN == "00000000-0000-0000-0000-000000000000"
                       and .environment.SPRING_CLOUD_VAULT_TOKEN == "00000000-0000-0000-0000-000000000000"))'

          # A third render proves every per-port override reaches its target.
          published=/tmp/published-overrides.json
          check "per-port overrides remap all eight loopback mappings" '
            ([.services[] | (.ports // [])[]
              | "\(.host_ip):\(.published):\(.target)"] | sort) == [
              "127.0.0.2:15673:5672",
              "127.0.0.2:15674:15672",
              "127.0.0.2:18080:8080",
              "127.0.0.2:18081:8081",
              "127.0.0.2:18082:8082",
              "127.0.0.2:18200:8200",
              "127.0.0.2:18761:8761",
              "127.0.0.2:18888:8888"
            ]'
          published=/tmp/published.json
          rm -f /tmp/published-drift.json /tmp/published-overrides.json

          # The loopback bind and per-port knobs are interpolation-only, so guard
          # the exact source lines in addition to the rendered JSON above.
          # shellcheck disable=SC2016
          port_lines=(
            '${ELARA_BIND:-127.0.0.1}:${ELARA_PORT_CONFIG:-8888}:8888'
            '${ELARA_BIND:-127.0.0.1}:${ELARA_PORT_DISCOVERY:-8761}:8761'
            '${ELARA_BIND:-127.0.0.1}:${ELARA_PORT_GATEWAY:-8080}:8080'
            '${ELARA_BIND:-127.0.0.1}:${ELARA_PORT_INVENTORY:-8081}:8081'
            '${ELARA_BIND:-127.0.0.1}:${ELARA_PORT_UOM:-8082}:8082'
            '${ELARA_BIND:-127.0.0.1}:${ELARA_PORT_RABBITMQ:-5672}:5672'
            '${ELARA_BIND:-127.0.0.1}:${ELARA_PORT_RABBITMQ_MGMT:-15672}:15672'
            '${ELARA_BIND:-127.0.0.1}:${ELARA_PORT_VAULT:-8200}:8200'
          )
          for mapping in "${port_lines[@]}"; do
            if ! grep -Fqx "      - \"${mapping}\"" compose.published.yml; then
              echo "::error::published compose is missing exact port line: - \"${mapping}\"" >&2
              exit 1
            fi
          done

          # shellcheck disable=SC2016
          bind_count=$(grep -Fo '${ELARA_BIND:-127.0.0.1}' compose.published.yml | wc -l || true)
          if [ "${bind_count}" -ne 8 ]; then
            echo "::error::published compose must use the loopback ELARA_BIND default exactly eight times (found ${bind_count})" >&2
            exit 1
          fi

          # Host Vault token variables must never be interpolated; the published
          # stack always pins the dev root token through VAULT_DEV_ROOT_TOKEN_ID.
          # shellcheck disable=SC2016
          if grep -Fq '${VAULT_TOKEN:' compose.published.yml \
             || grep -Fq '${SPRING_CLOUD_VAULT_TOKEN:' compose.published.yml; then
            echo "::error::compose.published.yml must not interpolate host VAULT_TOKEN or SPRING_CLOUD_VAULT_TOKEN" >&2
            exit 1
          fi

          echo "published compose: ${checked} assertions passed"
      - name: Assert logs overlay contract
        shell: bash
        run: |
          set -euo pipefail
          overlay=/tmp/published-logs.json
          base=/tmp/published.json
          checked=0

          check() {
            local label="$1"
            local filter="$2"
            if ! jq -e --slurpfile base "$base" "$filter" "$overlay" >/dev/null; then
              echo "::error::logs overlay assertion failed: $label" >&2
              exit 1
            fi
            checked=$((checked + 1))
          }

          check "exactly eleven services including dozzle" '
            (.services | keys | sort) == [
              "api-gateway",
              "config-service",
              "discovery-service",
              "dozzle",
              "inventory-service",
              "postgres-inventory",
              "postgres-uom",
              "rabbitmq",
              "unit-of-measure-service",
              "vault",
              "vault-loader"
            ]'

          check "project name and bridge network are unchanged" '
            .name == "elara-demo"
            and (.networks | keys) == ["elara-net"]
            and .networks["elara-net"].driver == "bridge"'

          check "overlay adds no top-level volumes, configs, or secrets" '
            ([.volumes, .configs, .secrets] | map(. // {} | length) | add) == 0'

          check "the dozzle socket is the only overlay bind mount" '
            ([.services[] | (.volumes // [])[] | select(.type != "tmpfs")
              | "\(.source):\(.target):\(.read_only)"] | sort) == [
              "/var/run/docker.sock:/var/run/docker.sock:true"
            ]'

          check "dozzle uses the exact pinned multi-arch image" '
            .services.dozzle.image == "amir20/dozzle:v11.3.3"'

          # shellcheck disable=SC2016
          check "dozzle publishes only loopback 9999 to 8080" '
            .services.dozzle.ports as $ports
            | ($ports | length) == 1
              and $ports[0].host_ip == "127.0.0.1"
              and $ports[0].published == "9999"
              and $ports[0].target == 8080
              and $ports[0].protocol == "tcp"'

          # shellcheck disable=SC2016
          check "dozzle mounts the Docker socket read-only" '
            .services.dozzle.volumes as $volumes
            | ($volumes | length) == 1
              and $volumes[0].type == "bind"
              and $volumes[0].source == "/var/run/docker.sock"
              and $volumes[0].target == "/var/run/docker.sock"
              and $volumes[0].read_only == true'

          check "dozzle disables actions and shell and opts out of analytics" '
            .services.dozzle.environment == {
              "DOZZLE_ENABLE_ACTIONS": "false",
              "DOZZLE_ENABLE_SHELL": "false",
              "DOZZLE_NO_ANALYTICS": "true"
            }'

          # shellcheck disable=SC2016
          check "dozzle healthcheck matches the pinned contract" '
            .services.dozzle.healthcheck as $hc
            | $hc.test == ["CMD", "/dozzle", "healthcheck"]
              and $hc.interval == "5s"
              and $hc.timeout == "30s"
              and $hc.retries == 5
              and $hc.start_period == "30s"
              and ($hc.disable // false) != true'

          check "dozzle joins elara-net with unless-stopped restart" '
            (.services.dozzle.networks | keys) == ["elara-net"]
            and .services.dozzle.restart == "unless-stopped"'

          check "dozzle adds no build, env_file, configs, or secrets" '
            .services.dozzle
            | (has("build") or has("env_file") or has("configs") or has("secrets")) | not'

          # shellcheck disable=SC2016
          check "base ten services are unchanged by the overlay" '
            (.services | del(.dozzle)) == ($base[0].services)'

          check "base ten service keys and environments survive the overlay" '
            (.services | del(.dozzle) | keys | sort) == [
              "api-gateway",
              "config-service",
              "discovery-service",
              "inventory-service",
              "postgres-inventory",
              "postgres-uom",
              "rabbitmq",
              "unit-of-measure-service",
              "vault",
              "vault-loader"
            ]
            and .services["inventory-service"].environment.SPRING_DATASOURCE_URL == "jdbc:postgresql://postgres-inventory:5432/inventory_db"
            and .services["unit-of-measure-service"].environment.SPRING_DATASOURCE_URL == "jdbc:postgresql://postgres-uom:5432/unit_of_measure_db"
            and .services["api-gateway"].environment.CONFIG_URI == "http://config-service:8888"
            and .services["config-service"].environment.SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL == "main"
            and .services["vault-loader"].environment.VAULT_ADDR == "http://vault:8200"
            and .services["postgres-inventory"].environment.POSTGRES_DB == "inventory_db"
            and .services["rabbitmq"].environment.RABBITMQ_DEFAULT_USER == "elara"'

          rm -f /tmp/published-logs.json

          echo "logs overlay: ${checked} assertions passed"
