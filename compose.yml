# Elara local stack — 9 services in the default render (10th, vault-loader, is profile-gated).
#
#   offline validation (no daemon):  docker compose config --quiet
#   bring-up (needs the daemon):     docker compose up -d --build
#
# Every interpolated value carries a `${VAR:-default}`, so the stack runs with
# no environment file; there is no checked-in `.env` contract. Explicit shell or
# command overrides are possible, but the supported configuration is the defaults
# below. They point at container DNS (sibling service names on `elara-net`), and
# no Java service env value points at `localhost`/`127.0.0.1`: inside the network
# `localhost` is the container itself, not the sibling service. See README.md,
# "Environment contract — no `.env` file". There is
# deliberately no tenth service in the default stack — the bootstrap loader is
# profile-gated (see README.md, "Vault bootstrap under compose").

name: elara

# Shared by every service: bounded json-file logs, same policy as the
# published compose. Keeps local development from filling the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- Java services (build contexts live in the sibling repos) ---------------

  config-service:
    build: ../config-service
    ports:
      - "8888:8888"
    expose:
      - "8888"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SERVER_PORT: ${SERVER_PORT_CONFIG:-8888}
      # Offline default: a read-only bind mount of ../centralized-configuration
      # (JGit clones FROM it into the container's own basedir, so `:ro` is fine).
      # Override CONFIG_GIT_URI/CONFIG_GIT_DEFAULT_LABEL in the environment to
      # clone from GitHub or from another branch instead.
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:-/config-repo}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: ${CONFIG_GIT_DEFAULT_LABEL:-main}
    volumes:
      - ../centralized-configuration:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    mem_limit: 256M
    logging: *default-logging
    networks:
      - elara-net

  discovery-service:
    build: ../discovery-service
    ports:
      - "8761:8761"
    expose:
      - "8761"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      # Belt-and-braces only: `server.port: 8761` is hardcoded in
      # discovery-service/src/main/resources/application.yml (no placeholder),
      # so this env var is what Boot's relaxed binding would read if the YAML
      # ever gains one. The port itself is fixed at 8761.
      SERVER_PORT: ${SERVER_PORT_DISCOVERY:-8761}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    mem_limit: 256M
    logging: *default-logging
    networks:
      - elara-net

  api-gateway:
    build: ../api-gateway
    ports:
      - "8080:8080"
    expose:
      - "8080"
    labels:
      com.elara.demo.release: "2026-10-20"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SERVER_PORT: ${SERVER_PORT_GATEWAY:-8080}
      CONFIG_URI: ${CONFIG_URI:-http://config-service:8888}
      EUREKA_URI: ${EUREKA_URI:-http://discovery-service:8761/eureka/}
    depends_on:
      config-service:
        condition: service_healthy
        restart: true
      discovery-service:
        condition: service_healthy
        restart: true
      inventory-service:
        condition: service_healthy
        restart: true
      unit-of-measure-service:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    mem_limit: 512M
    logging: *default-logging
    networks:
      - elara-net

  inventory-service:
    build: ../inventory-service
    ports:
      - "127.0.0.1:8081:8081"
    expose:
      - "8081"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SERVER_PORT: ${SERVER_PORT_INVENTORY:-8081}
      CONFIG_URI: ${CONFIG_URI:-http://config-service:8888}
      EUREKA_URI: ${EUREKA_URI:-http://discovery-service:8761/eureka/}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres-inventory:5432/inventory_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-elara}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-elara}
      VAULT_URI: ${VAULT_URI:-http://vault:8200}
      # I-06 double mapping: the application YAML reads `${VAULT_TOKEN:...}`
      # while Boot's relaxed binding reads SPRING_CLOUD_VAULT_TOKEN. Both are
      # fed from the Vault dev root token so they can never drift into a 403.
      VAULT_TOKEN: ${VAULT_TOKEN:-${VAULT_DEV_ROOT_TOKEN_ID:-00000000-0000-0000-0000-000000000000}}
      SPRING_CLOUD_VAULT_TOKEN: ${SPRING_CLOUD_VAULT_TOKEN:-${VAULT_DEV_ROOT_TOKEN_ID:-00000000-0000-0000-0000-000000000000}}
    depends_on:
      config-service:
        condition: service_healthy
        restart: true
      discovery-service:
        condition: service_healthy
        restart: true
      postgres-inventory:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      vault:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    mem_limit: 512M
    logging: *default-logging
    networks:
      - elara-net

  unit-of-measure-service:
    build: ../unit-of-measure-service
    ports:
      - "127.0.0.1:8082:8082"
    expose:
      - "8082"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SERVER_PORT: ${SERVER_PORT_UOM:-8082}
      CONFIG_URI: ${CONFIG_URI:-http://config-service:8888}
      EUREKA_URI: ${EUREKA_URI:-http://discovery-service:8761/eureka/}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres-uom:5432/unit_of_measure_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-elara}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-elara}
      VAULT_URI: ${VAULT_URI:-http://vault:8200}
      # Same I-06 double mapping as inventory-service.
      VAULT_TOKEN: ${VAULT_TOKEN:-${VAULT_DEV_ROOT_TOKEN_ID:-00000000-0000-0000-0000-000000000000}}
      SPRING_CLOUD_VAULT_TOKEN: ${SPRING_CLOUD_VAULT_TOKEN:-${VAULT_DEV_ROOT_TOKEN_ID:-00000000-0000-0000-0000-000000000000}}
    depends_on:
      config-service:
        condition: service_healthy
        restart: true
      discovery-service:
        condition: service_healthy
        restart: true
      postgres-uom:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      vault:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    mem_limit: 512M
    logging: *default-logging
    networks:
      - elara-net

  # --- Infrastructure services ------------------------------------------------

  postgres-inventory:
    image: postgres:16.15-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: inventory_db
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-inventory_db,unit_of_measure_db}
      TZ: ${TZ:-America/Bogota}
    volumes:
      # Ephemeral on purpose: tmpfs is destroyed when the container stops, so
      # every start gets an empty data directory and the init scripts run
      # again; the service seeds its database on startup (dev profile).
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 134217728  # 128 MiB cap; tmpfs pages count against mem_limit
      # `$$` keeps compose from interpolating POSTGRES_USER/POSTGRES_DB, so the
      # container's own entrypoint values are what pg_isready checks.
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      # TCP, not the default socket: while initdb and the init scripts run, the
      # image serves a temporary socket-only instance, so a socket probe could
      # report ready before initialization finishes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 512M  # tmpfs data is RAM and is charged to this limit
    logging: *default-logging
    networks:
      - elara-net

  postgres-uom:
    image: postgres:16.15-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: unit_of_measure_db
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-inventory_db,unit_of_measure_db}
      TZ: ${TZ:-America/Bogota}
    volumes:
      # Ephemeral on purpose: tmpfs is destroyed when the container stops, so
      # every start gets an empty data directory and the init scripts run
      # again; the service seeds its database on startup (dev profile).
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 134217728  # 128 MiB cap; tmpfs pages count against mem_limit
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      # TCP, not the default socket: while initdb and the init scripts run, the
      # image serves a temporary socket-only instance, so a socket probe could
      # report ready before initialization finishes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 512M  # tmpfs data is RAM and is charged to this limit
    logging: *default-logging
    networks:
      - elara-net

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    expose:
      - "5672"
      - "15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-elara}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-elara}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    mem_limit: 256M
    logging: *default-logging
    networks:
      - elara-net

  vault:
    image: hashicorp/vault:1.16.3
    ports:
      - "8200:8200"
    expose:
      - "8200"
    # Dev mode: in-memory storage, unsealed, root token from the env default.
    command: ["server", "-dev", "-dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID:-00000000-0000-0000-0000-000000000000}"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-00000000-0000-0000-0000-000000000000}
      # LITERAL on purpose (not an environment override): the healthcheck runs the Vault
      # CLI inside this container, and the CLI defaults to https while the dev
      # server speaks http. This is the one intentional loopback in the file.
      VAULT_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512M
    logging: *default-logging
    networks:
      - elara-net

  # One-shot Vault bootstrap (profile-gated: hidden from the default 9-service
  # stack; default `config`/`up` still render exactly 9). CLI 1.16.3 == server 1.16.3.
  # Run: sudo docker compose --profile bootstrap up vault-loader
  vault-loader:
    build: ./vault-loader
    profiles: ["bootstrap"]
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-${VAULT_DEV_ROOT_TOKEN_ID:-00000000-0000-0000-0000-000000000000}}
      SECRETS_DIR: /secrets
      PROFILES: ${VAULT_LOAD_PROFILES:-dev}
    volumes:
      - ./scripts:/work/scripts:ro
      - ../centralized-configuration/service-secrets:/secrets:ro
    logging: *default-logging
    networks:
      - elara-net
    restart: "no"

networks:
  elara-net:
    driver: bridge
